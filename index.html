<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-hex"></div>

    <main class="wrap">

        <div class="left">
        <div class="logo"><span class="hex"><img src="favicon-32x32.png" alt=""></span>NEONCORE</div>

        <h1><span class="slashes">//</span>JOIN THE <br> NEXUS</h1>
        <P class="sub">INITIALIZE YOUR NEONCORE IDENTITY</P>

        <div class="divider"></div>

        <div class="status">
        <div class="row head"><span>OPERATOR ID</span><span>0/5 READY</span></div>
        <div class="id">UNASSIGNED</div>

        <div class="row"><span>CALLSIGN</span><span class="line"></span><span class="state">PENDING</span></div>
        <div class="row"><span>EMAIL</span><span class="line"></span><span class="state">PENDING</span></div>
        <div class="row"><span>PASSWORD</span><span class="line "></span><span class="state">PENDING</span></div>
        <div class="row"><span>CONFIRM</span><span class="line"></span><span class="state">PENDING</span></div>
        <div class="row"><span>TERMS</span><span class="line"></span><span class="state">REQUIRED</span></div>
        </div>
        </div>

<div class="right-card">
 <div class="corner tl"></div><div class="corner br"></div>

 <div class="card-head"><span>NEW OPERATOR</span> <span>ALL FIELDS REQUIRED</span></div>

<form>
<label><span class="arrow">></span>CALLSIGN</label>
<input type="text" placeholder="e.g. vortex_07">
<small>3-20 characters:letters,number,_or-</small>

<label><span class="arrow">></span>EMAIL</label>
<input type="email" placeholder="you@example.com">


<label><span class="arrow">></span>PASSWORD</label>
<div class="pass-wrap"><input type="password"><span class="eye"><img src="icon-eye.svg" alt=""></span></div>
<div class="meter"><span></span><span></span><span></span><span></span></div>
<small>AT least 8 characters</small>

<label><span class="arrow">></span>CONFIRM PASSWORD</label>
<div class="pass-wrap"><input type="password"><span class="eye"><img src="icon-eye.svg" alt=""></span></div>

<div class="check">
    <input type="checkbox"id="terms">
    <label for="terms">I accept the <a href="#">terms</a>and <a href="#">privacy policy.</a></label>
</div>

<button type="submit">INITIALIZE ACCOUNT</button>

<P class="login">Already an operator? <a href="#">log in</a> </P>
</form>
</div>
    </main>
 
</body>
</html>
